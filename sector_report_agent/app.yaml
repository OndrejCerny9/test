# Databricks Apps configuration for Sector Report Agent
# This app parses Chart.js configurations from HTML, renders charts with matplotlib,
# converts the result to Word documents (.docx), and saves to a Unity Catalog Volume.

command:
  - "bash"
  - "start.sh"

env:
  - name: REPORT_VOLUME_PATH
    value: "/Volumes/agentbricks/volumes/agent_reports"
